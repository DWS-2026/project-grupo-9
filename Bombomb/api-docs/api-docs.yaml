    ImageDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        owner:
          type: string
    OrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        price:
          type: number
          format: float
        amount:
          type: integer
          format: int32
        isOpen:
          type: boolean
        user:
          $ref: "#/components/schemas/UserEmailDTO"
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/BoxGetDTO"
    UserEmailDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
    UserGetDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        telephone:
          type: string
        email:
          type: string
        image:
          $ref: "#/components/schemas/ImageDTO"
        description:
          type: string
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderDTO"
    UserPostDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        telephone:
          type: string
        email:
          type: string
        image:
          $ref: "#/components/schemas/ImageDTO"
        description:
          type: string
        password:
          type: string
    FileDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        originalName:
          type: string
        name:
          type: string
        user:
          $ref: "#/components/schemas/UserGetDTO"
    BoxPostDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    IsOpenRequest:
      type: object
      properties:
        isOpen:
          type: boolean
